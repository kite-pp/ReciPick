name: '✨ 기능 개발'
description: '새로운 사용자 기능이나 화면 구현을 제안합니다.'
title: '[FEAT] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: '구현 목적과 완료 조건이 분명하도록 작성해 주세요.'
  - type: textarea
    id: background
    attributes:
      label: 배경 및 목적
      description: 이 기능이 필요한 이유와 해결하려는 문제를 작성해 주세요.
      placeholder: 사용자가 보유 재료를 기준으로 레시피를 추천받을 수 있어야 합니다.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 구현 요구사항
      description: 구현할 동작을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 보유 재료 기반 일치율을 계산한다.
        - [ ] 일치율이 높은 순으로 최대 8개를 보여준다.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: 관련 화면 또는 경로
      placeholder: '/recommend'
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료 여부를 판단할 수 있는 구체적인 기준을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: Figma, Notion, 관련 이슈 링크를 작성해 주세요.
