name: '🎨 UI·디자인'
description: '화면, 컴포넌트, 스타일 또는 접근성 작업을 정의합니다.'
title: '[DESIGN] '
labels:
  - enhancement
body:
  - type: input
    id: target
    attributes:
      label: 대상 화면 또는 컴포넌트
      placeholder: 'Home / RecipeCard'
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: Figma 링크
      description: 적용할 프레임 또는 컴포넌트 링크를 작성해 주세요.
  - type: textarea
    id: changes
    attributes:
      label: 작업 내용
      placeholder: |
        - [ ] 레이아웃 구현
        - [ ] Empty State 구현
        - [ ] 키보드 포커스 확인
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 스타일 영향 범위
      options:
        - 페이지 전용 CSS Module
        - 공통 컴포넌트 CSS Module
        - 전역 스타일
        - 정적 자산
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: Figma 일치 여부와 확인할 상태를 작성해 주세요.
    validations:
      required: true
