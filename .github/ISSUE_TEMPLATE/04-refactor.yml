name: '♻️ 리팩터링'
description: '기능 변화 없이 구조와 유지보수성을 개선합니다.'
title: '[REFACTOR] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 현재 문제
      description: 중복, 결합도, 복잡도 등 개선이 필요한 이유를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 변경 대상
      description: 파일, 컴포넌트, 훅 또는 로직의 범위를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: 개선 방향
      description: 바꾸려는 구조와 유지해야 할 동작을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 회귀 검증 방법
      description: 기능 변화가 없음을 어떻게 확인할지 작성해 주세요.
    validations:
      required: true
