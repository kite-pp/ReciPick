name: '📝 문서 작업'
description: 'README, 컨벤션, Notion 또는 코드 문서를 정리합니다.'
title: '[DOCS] '
labels:
  - documentation
body:
  - type: dropdown
    id: document
    attributes:
      label: 문서 종류
      options:
        - README
        - React 컨벤션
        - Notion 프로젝트 문서
        - 코드 주석
        - 기타
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 변경 이유
      description: 현재 문서의 문제와 변경이 필요한 이유를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 변경 내용
      description: 추가·수정·삭제할 내용을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 관련 링크
      description: 기준 문서, 이슈, PR 링크를 작성해 주세요.
